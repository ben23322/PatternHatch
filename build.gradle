buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        mavenCentral()
    }
    dependencies {
        // 使用本机 .gradle 缓存中已有的版本，可离线构建
        classpath group: "net.minecraftforge.gradle", name: "ForgeGradle", version: "3.0.197", changing: true
    }
}

apply plugin: "net.minecraftforge.gradle"

version = "0.1.10"
group = "tj.patternhatch"
archivesBaseName = "patternhatch"

sourceCompatibility = targetCompatibility = "1.8"

minecraft {
    mappings channel: "snapshot", version: "20171003-1.12"
}

// TJ 整合包 mods 目录（本地直接引用，无需拷贝）
def tjMods = "D:/aaa123/prism/instances/Technological_Journey_1.5 Beta-hot_fix/minecraft/mods"

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2860:userdev3"

    compileOnly files(
        "$tjMods/gregtech_tj_fork-1.18.2.jar",
        "$tjMods/gregicality_tj_fork-0.26.2-hotfix.jar",
        "$tjMods/ae2-uel-v0.56.7.jar",
        "$tjMods/ae2fc-2.7.10-unofficial.jar",
        "$tjMods/nae2-1.6.4.jar",
        "$tjMods/!mixinbooter-10.7.jar",
        "$tjMods/CodeChickenLib-1.12.2-3.2.3.358-universal.jar",
    )
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
